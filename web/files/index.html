<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P2P Gateway</title>
  <script>
      window.__GATEWAY_CONFIG__ = /*__P2P_CONFIG__*/null;
    </script>
  <style>
      body { font-family: -apple-system, system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px; }
      h1 { font-size: 24px; }
      .row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #eee; }
      .row .lbl { color: #666; }
      .row .val { font-family: ui-monospace, SFMono-Regular, monospace; }
      .ok { color: #2e7d32; font-weight: 600; }
      .bad { color: #c62828; font-weight: 600; }
      button { padding: 8px 14px; margin-top: 12px; }
      pre { background: #f6f8fa; padding: 12px; border-radius: 6px; overflow-x: auto; }
      .target-bar { display: flex; gap: 8px; margin: 16px 0; }
      .target-bar input { flex: 1; padding: 8px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
      .target-bar button { white-space: nowrap; }
  </style>
</head>
<body>
  <h1>P2P Gateway</h1>

  <div class="target-bar">
    <input id="targetInput" type="text" placeholder="http://127.0.0.1:3000 or ws://127.0.0.1:8080" />
    <button id="applyTarget">Connect</button>
  </div>

  <div class="row"><span class="lbl">Target</span><span class="val" id="target">…</span></div>
  <div class="row"><span class="lbl">Gateway Host</span><span class="val" id="host">…</span></div>
  <div class="row"><span class="lbl">Service Worker</span><span class="val" id="sw">…</span></div>
  <div class="row"><span class="lbl">Signaling</span><span class="val" id="signal">…</span></div>
  <div class="row"><span class="lbl">STUN</span><span class="val" id="stun">…</span></div>
  <div class="row"><span class="lbl">ICE</span><span class="val" id="ice">…</span></div>
  <div class="row"><span class="lbl">DataChannel</span><span class="val" id="dc">…</span></div>
  <div class="row"><span class="lbl">Status</span><span class="val" id="status">Connecting</span></div>

  <h2>Test request</h2>
  <button id="btn">Fetch / via P2P tunnel</button>
  <pre id="out">(click the button to test)</pre>

  <script>
    // Apply target: reload page with ?target=<url>
    document.getElementById('applyTarget').addEventListener('click', () => {
      const t = document.getElementById('targetInput').value.trim();
      if (!t) return;
      const u = new URL(location.href);
      u.searchParams.set('target', t);
      location.href = u.toString();
    });
    // Pre-fill from current URL param
    const cur = new URLSearchParams(location.search).get('target');
    if (cur) document.getElementById('targetInput').value = cur;
  </script>
  <script src="/client.js"></script>
</body>
</html>
